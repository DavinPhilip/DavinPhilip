<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davin Philip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            margin: 0;
            overflow: hidden; /* Keeps everything on one screen */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container to hold Name and Stack */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            position: relative;
        }

        /* Name Animation: Pop in, then move left */
        .name-container {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            transition: all 1s cubic-bezier(0.77, 0, 0.175, 1);
            position: absolute;
            z-index: 10;
        }
        @media (min-width: 768px) { .name-container { font-size: 6rem; } }

        .name-container.pop-in {
            animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

        /* Class added via JS to slide the name left */
        .name-container.move-left {
            transform: translateX(-150px);
        }
        @media (max-width: 768px) { .name-container.move-left { transform: translateY(-150px); } }

        /* Stacked Card Logic */
        .stack {
            position: absolute;
            width: 300px;
            height: 400px;
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: translateX(200px);
        }
        @media (max-width: 768px) { .stack { transform: translateY(100px); } }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Card visibility states */
        .card.show { opacity: 1; transform: scale(1) translateY(0); }
        .card:nth-child(2).show { transform: scale(0.95) translateY(15px) translateX(10px); z-index: -1; opacity: 0.5; }
        .card:nth-child(3).show { transform: scale(0.9) translateY(30px) translateX(20px); z-index: -2; opacity: 0.2; }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="name" class="name-container pop-in">Davin Philip</div>

        <div id="stack" class="stack">
            <div class="card">PLACEHOLDER 3</div>
            <div class="card">PLACEHOLDER 2</div>
            <div class="card">PLACEHOLDER 1</div>
        </div>
    </div>

    <script>
        const name = document.getElementById('name');
        const stack = document.getElementById('stack');
        const cards = document.querySelectorAll('.card');

        // Sequence:
        setTimeout(() => {
            // 1. Move name left
            name.classList.add('move-left');
            stack.style.opacity = "1";
            
            // 2. Pop in first card after name moves
            setTimeout(() => {
                cards[2].classList.add('show');
                
                // 3. Pop in second card 1 second later
                setTimeout(() => {
                    cards[1].classList.add('show');
                    
                    // 4. Pop in third card 1 second later
                    setTimeout(() => {
                        cards[0].classList.add('show');
                    }, 1000);
                }, 1000);
            }, 800);
        }, 1500); // Initial wait
    </script>

</body>
</html>
