<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davin Philip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;800&display=swap');
        
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            margin: 0;
            overflow-x: hidden;
        }

        /* The "Pop" Animation for the Name */
        .name-pop {
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 32px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.1);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <section class="h-screen flex flex-col justify-center items-center px-6 text-center">
        <h1 class="text-6xl md:text-[10rem] font-extrabold tracking-tighter name-pop">
            Davin Philip
        </h1>
        
        <div class="absolute bottom-10 animate-bounce opacity-20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </div>
    </section>

    <section class="min-h-screen py-20 px-6 max-w-5xl mx-auto flex flex-col justify-center reveal">
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                title="Davin Philip Case Study" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="mt-12 text-center">
            <h2 class="text-3xl font-bold tracking-tight">Lead Gen & Tagging Architecture</h2>
            <p class="text-gray-500 mt-4 text-lg">Systemized acquisition walkthrough.</p>
        </div>
    </section>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>

</body>
</html>
